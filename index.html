<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16131D">
<title>Leonida Journal</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16131D; --fog:#0B0A0F; --surface:#221D2B; --surface2:#2E2638; --deep:#17131E;
  --line:#3A3245; --text:#EEE6D8; --muted:#A99FB5; --pink:#F2789A; --teal:#63C7B8;
  --orange:#F0A35E; --cream:#EDE2CC; --cream2:#E3D7BF; --ink:#2B2420; --inkmuted:#5E5047; --stamp:#A8344F;
  --script:'Yellowtail',cursive; --type:'Courier Prime',ui-monospace,monospace; --ui:'Inter',system-ui,sans-serif;
  --navh:84px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px}
body{overscroll-behavior:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
#view{position:fixed;inset:0 0 var(--navh) 0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#view.full{bottom:0}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 28px}
.hidden{display:none!important}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;padding-top:max(22px,env(safe-area-inset-top))}
.brand{font-family:var(--script);font-size:42px;line-height:1;color:var(--pink)}
.sub{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--teal)}
.icon-btn{width:44px;height:44px;border-radius:22px;border:none;background:var(--surface);color:var(--text);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--teal);background:transparent;color:var(--teal);font-weight:600;font-size:14px}
.pill.live{background:var(--teal);color:var(--bg)}
.pill.small{height:36px;padding:0 12px;font-size:13px;border-width:1px}
.pill.pink{border-color:var(--pink);color:var(--pink)}

/* cards */
.postcard{background:var(--cream);color:var(--ink);padding:16px 18px 14px;border-radius:3px;box-shadow:0 8px 20px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:8px}
.tilt-l{transform:rotate(-1.2deg)} .tilt-r{transform:rotate(1deg)}
.stamp{align-self:flex-start;font-family:var(--type);font-weight:700;font-size:12px;letter-spacing:.15em;color:var(--stamp);border:2px solid var(--stamp);padding:2px 8px;transform:rotate(-3deg)}
.typed{font-family:var(--type);font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.typed.small{font-size:13px}
.inkmuted{color:var(--inkmuted);font-family:var(--type);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:24px}
.stat{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:24px}
.label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sechead{display:flex;justify-content:space-between;align-items:center;margin:22px 0 8px;gap:8px}
.sechead .label{font-size:13px}
.linkbtn{background:none;border:none;color:var(--teal);font-weight:600;font-size:13px;padding:10px 0;min-height:44px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini-post{text-align:left;border:none;background:var(--cream);color:var(--ink);border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 12px rgba(0,0,0,.4);min-height:72px}
.mini-post b{font-family:var(--type);font-size:14px;line-height:1.25}
.mini-post span{font-size:12px;color:var(--inkmuted)}
.feed{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:12px;padding:12px;border:none;width:100%;text-align:left;color:var(--text)}
.row .t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .t.typed{font-weight:400;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal}
.row .m{font-size:12px;color:var(--muted);margin-top:3px}
.row .m .area{color:var(--teal)}
.row .body{min-width:0;flex:1}
.disc{width:40px;height:40px;border-radius:20px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pol{background:#F4EEE3;padding:5px 5px 14px;transform:rotate(-3deg);box-shadow:0 4px 10px rgba(0,0,0,.4);flex-shrink:0}
.pol .ph{width:64px;height:52px;background:#3D4F57;display:block;object-fit:cover}
.empty{color:var(--muted);font-size:14px;line-height:1.5;padding:18px;background:var(--surface);border-radius:12px;text-align:center}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;height:var(--navh);background:#1D1925;border-top:1px solid #332C3E;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:5}
#nav button{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;min-height:48px;justify-content:center}
#nav button.on{color:var(--text);font-weight:600}
#nav .plus{width:60px;height:60px;border-radius:30px;background:var(--pink);color:var(--bg);margin:-26px auto 0;box-shadow:0 6px 18px rgba(242,120,154,.35)}
#nav.hidden-nav{display:none}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(5,4,8,.7);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;background:var(--surface);border-radius:22px 22px 0 0;z-index:21;transform:translateY(105%);transition:transform .25s ease;overflow-y:auto;padding:10px 20px max(20px,env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.5)}
#sheet.on{transform:none}
#sheet .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{align-self:center;width:40px;height:4px;border-radius:2px;background:#4A4156}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{margin:0;font-size:20px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--deep);padding:4px;border-radius:12px}
.seg button{height:40px;border:none;border-radius:9px;background:transparent;color:var(--muted);font-size:13px;font-weight:600}
.seg button.on{background:var(--pink);color:var(--bg);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--deep);color:var(--text);padding:0 14px;font-size:15px;width:100%}
.field select{appearance:none;-webkit-appearance:none}
.field textarea{padding:10px 12px;min-height:72px;resize:vertical}
.field textarea.paper{background:var(--cream);color:var(--ink);border:none;border-radius:4px;font-family:var(--type);font-size:14px;line-height:1.4}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--teal);outline-offset:1px}
.areastat{font-size:13px;display:flex;align-items:center;gap:8px;min-height:20px;flex-wrap:wrap}
.areastat.ok{color:var(--teal)} .areastat.warn{color:var(--orange)}
.areastat button{background:none;border:1px solid var(--orange);color:var(--orange);border-radius:14px;height:30px;padding:0 10px;font-size:12px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:13px;flex-shrink:0}
.chip.on{background:var(--cream);border-color:var(--cream);color:var(--ink);font-weight:600}
.chip.dash{border-style:dashed;color:var(--muted)}
.marks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.marks button{height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.marks button.on.fav{border-color:var(--pink);background:#3A1F2A;color:var(--pink);font-weight:600}
.marks button.on.back{border-color:var(--orange);background:#3A2A1E;color:var(--orange);font-weight:600}
.marks button.on.found{border-color:var(--cream);background:#34302A;color:var(--cream);font-weight:600}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ghost{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--deep);color:var(--text);font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.ghost.teal{border-color:var(--teal);color:var(--teal);font-weight:600}
.ghost.danger{border-color:#7A3445;color:#F08BA0}
.primary{height:54px;border-radius:14px;border:none;background:var(--pink);color:var(--bg);font-size:16px;font-weight:700;width:100%}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .tb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;background:var(--deep)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .x{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:13px;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:1}

/* place */
.carousel{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 24px 22px;margin:0 -20px}
.carousel .bigpol{scroll-snap-align:center;flex-shrink:0;background:#F4EEE3;padding:10px 10px 34px;box-shadow:0 12px 28px rgba(0,0,0,.5);position:relative;width:min(330px,82vw)}
.carousel .bigpol:nth-child(odd){transform:rotate(1.5deg)} .carousel .bigpol:nth-child(even){transform:rotate(-1.2deg)}
.bigpol img{width:100%;height:190px;object-fit:cover;display:block;background:#2F4247}
.bigpol .cap{position:absolute;left:14px;right:40px;bottom:8px;font-family:var(--type);font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bigpol .n{position:absolute;right:12px;bottom:10px;font-size:11px;color:var(--inkmuted)}
.nophoto{margin:14px 0 4px;height:120px;border:1.5px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:none;width:100%;gap:8px}
.ptitle{font-size:24px;font-weight:700;line-height:1.2;margin:8px 0 10px}
.tag{height:28px;padding:0 10px;border-radius:14px;font-size:12px;display:inline-flex;align-items:center;border:none}
.tag.area{background:#1E3337;color:var(--teal);font-weight:600}
.tag.kind{background:var(--surface2);color:var(--text)}
.tag.back{background:#3A2A1E;color:var(--orange);font-weight:600}
.tag.fav{background:#3A1F2A;color:var(--pink);font-weight:600}
.tag.off{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.visit{background:var(--cream);color:var(--ink);border-radius:3px;padding:10px 14px;font-family:var(--type);font-size:13px;line-height:1.45;white-space:pre-wrap}
.visit:nth-child(even){background:var(--cream2);transform:rotate(.4deg)} .visit:nth-child(odd){transform:rotate(-.5deg)}
.banner{background:var(--cream);color:var(--ink);border-radius:3px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--type);font-size:14px;margin-top:12px}
.banner button{background:none;border:1.5px solid var(--stamp);color:var(--stamp);border-radius:16px;height:34px;padding:0 12px;font-weight:700;font-family:var(--ui);font-size:12px}
.actions{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:16px}
.actions a,.actions .sec{height:52px;border-radius:14px;border:1px solid var(--teal);color:var(--teal);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;background:none}

/* map */
#mapwrap{position:fixed;inset:0 0 var(--navh) 0;background:var(--fog);touch-action:none;overflow:hidden}
#mapc{position:absolute;inset:0;width:100%;height:100%;display:block}
.maptop{position:absolute;left:0;right:0;top:0;padding:max(22px,env(safe-area-inset-top)) 20px 12px;background:linear-gradient(var(--fog) 60%,transparent);pointer-events:none}
.maptop > *{pointer-events:auto}
.maptop .brand{font-size:36px}
.hscroll{display:flex;gap:6px;overflow-x:auto;margin:12px -20px 0;padding:0 20px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{background:var(--bg)}
.hscroll .chip.on{background:var(--cream)}
.mapcard{position:absolute;left:16px;right:16px;bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 26px rgba(0,0,0,.5);color:var(--text);text-align:left;width:auto}
.mapbar{position:absolute;left:16px;right:16px;bottom:16px;background:var(--cream);color:var(--ink);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 26px rgba(0,0,0,.5)}
.mapbar .typed{font-size:14px}
.mapbar .two button{height:46px;border-radius:12px;font-weight:700;border:none}
.mapzoom{position:absolute;right:16px;top:50%;display:flex;flex-direction:column;gap:8px;transform:translateY(-50%)}
.mapzoom button{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:20px}
.maphint{position:absolute;left:20px;right:20px;top:46%;text-align:center;color:var(--muted);font-size:14px;line-height:1.5;pointer-events:none}

/* photos */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px;margin-top:16px}
.pgrid button{border:none;background:#F4EEE3;padding:7px 7px 28px;box-shadow:0 6px 14px rgba(0,0,0,.45);position:relative;text-align:left}
.pgrid button:nth-child(4n+1){transform:rotate(-1.5deg)} .pgrid button:nth-child(4n+2){transform:rotate(1.2deg)} .pgrid button:nth-child(4n+3){transform:rotate(.8deg)} .pgrid button:nth-child(4n){transform:rotate(-1deg)}
.pgrid img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#3D4F57}
.pgrid span{position:absolute;left:8px;right:8px;bottom:6px;font-family:var(--type);font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer{position:fixed;inset:0;background:rgba(5,4,8,.96);z-index:30;display:flex;flex-direction:column}
#viewer .vtop{display:flex;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 12px 8px}
#viewer .vimg{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 8px}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}
#viewer .vbot{padding:12px 20px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;max-width:560px;width:100%;margin:0 auto}

/* misc */
h1.page{font-family:var(--script);font-weight:400;font-size:40px;color:var(--pink);margin:0;line-height:1}
.search{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--deep);padding:0 14px;margin-top:14px;color:var(--text)}
.station{margin-top:20px}
.setrow{background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.setrow p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
#toast{position:fixed;left:50%;bottom:calc(var(--navh) + 16px);transform:translateX(-50%) translateY(20px);background:var(--cream);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;opacity:0;transition:all .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
svg{flex-shrink:0}
</style>
</head>
<body>
<div id="view"></div>
<nav id="nav" aria-label="Main">
  <button data-tab="home" aria-label="Journal"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Journal</button>
  <button data-tab="map" aria-label="Map"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
  <div><button class="plus" data-act="new" aria-label="New entry"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <button data-tab="photos" aria-label="Photos"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photos</button>
  <button data-tab="radio" aria-label="Radio"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8 17 3"/><circle cx="15" cy="14" r="3"/><path d="M6.5 12h3M6.5 16h3"/></svg>Radio</button>
</nav>
<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="inner" id="sheetInner"></div></div>
<div id="viewer" class="hidden"></div>
<div id="toast" role="status"></div>
<input type="file" id="filePick" accept="image/*" multiple class="hidden">
<input type="file" id="mapPick" accept="image/*" class="hidden">
<input type="file" id="backupPick" accept="application/json,.json" class="hidden">
<script src="app.js"></script>
</body>
</html>
